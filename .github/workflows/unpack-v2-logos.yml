name: Unpack v2 logos
on:
  workflow_dispatch:
  push:
    paths:
      - "_incoming/**"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode zip, add logos, clean up
        run: |
          set -euo pipefail
          test -f _incoming/v2_logos.zip.b64
          base64 -d _incoming/v2_logos.zip.b64 > /tmp/v2.zip
          mkdir -p logos
          unzip -o /tmp/v2.zip -d logos
          rm -rf _incoming
          rm -f .github/workflows/unpack-v2-logos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Add flattened v2 directory logos (navy or white, 12% padding) for white-circle avatars."
          git push
